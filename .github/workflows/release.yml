name: Release

# Push a tag like v2.0.1 to build an installer and publish it as a GitHub release.
# Installed copies then update themselves from this repository's releases.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      VELOPACK_VERSION: 1.2.161 # keep in step with the Velopack package in MicSwitch.csproj
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Sources/MicSwitch.slnx -c Release

      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV
          dotnet publish Sources/MicSwitch/MicSwitch.csproj -c Release -r win-x64 --self-contained `
            -p:Version=$version -p:UpdateRepositoryUrl=$env:REPO_URL -o publish

      - name: Package
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version $env:VELOPACK_VERSION
          # Earlier releases are needed to build delta updates; there are none the first time.
          vpk download github --repoUrl $env:REPO_URL --token "${{ secrets.GITHUB_TOKEN }}"
          if ($LASTEXITCODE -ne 0) { Write-Host "No earlier release found"; $global:LASTEXITCODE = 0 }
          vpk pack --packId MicSwitch --packVersion $env:VERSION --packDir publish --mainExe MicSwitch.exe `
            --packTitle MicSwitch --icon Sources/MicSwitch/Resources/microphoneEnabled.ico

      - name: Upload
        shell: pwsh
        run: |
          vpk upload github --repoUrl $env:REPO_URL --publish --releaseName "MicSwitch $env:VERSION" `
            --tag "${{ github.ref_name }}" --token "${{ secrets.GITHUB_TOKEN }}"
